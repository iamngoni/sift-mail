# Format, lint, test on all three platforms, and the 95% line-coverage gate.
# Runs on self-hosted runners only; see README "CI and releases" for labels.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: [self-hosted, Linux, X64]
          - name: windows-x64
            runner: [self-hosted, Windows, X64]
          - name: macos-arm64
            runner: [self-hosted, macOS, ARM64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Use Git Bash (Windows)
        # A bare "bash" can resolve to WSL's bash.exe, which can't see the
        # runner's Windows paths. Put Git for Windows' bash first instead.
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Split-Path (Split-Path (Get-Command git).Source)
          # Windows PowerShell's utf8 adds a BOM, which would spoil the path.
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$git\bin`n")

      - name: System libraries (Linux)
        # GPUI links against these; install whichever the runner lacks.
        if: runner.os == 'Linux'
        run: |
          pkgs="build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev libzstd-dev"
          missing=$(for p in $pkgs; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done)
          if [ -n "$missing" ]; then
            if [ "$(id -u)" = 0 ]; then
              sudo=""
            elif sudo -n true 2>/dev/null; then
              sudo=sudo
            else
              echo "::error::This runner can't install packages (no root, no sudo). Add them to the runner image: apt-get install -y" $missing
              exit 1
            fi
            $sudo apt-get update -qq
            $sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $missing
          fi

      - name: Toolchain
        # rust-toolchain.toml pins the version; rustup installs it on first use.
        run: rustup show active-toolchain

      - name: Format
        if: matrix.name == 'linux-x64'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

  coverage:
    name: Coverage (linux-x64, 95% lines)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Use Git Bash (Windows)
        # A bare "bash" can resolve to WSL's bash.exe, which can't see the
        # runner's Windows paths. Put Git for Windows' bash first instead.
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = Split-Path (Split-Path (Get-Command git).Source)
          # Windows PowerShell's utf8 adds a BOM, which would spoil the path.
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$git\bin`n")

      - name: System libraries (Linux)
        # GPUI links against these; install whichever the runner lacks.
        if: runner.os == 'Linux'
        run: |
          pkgs="build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libssl-dev libzstd-dev"
          missing=$(for p in $pkgs; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done)
          if [ -n "$missing" ]; then
            if [ "$(id -u)" = 0 ]; then
              sudo=""
            elif sudo -n true 2>/dev/null; then
              sudo=sudo
            else
              echo "::error::This runner can't install packages (no root, no sudo). Add them to the runner image: apt-get install -y" $missing
              exit 1
            fi
            $sudo apt-get update -qq
            $sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $missing
          fi

      - name: Install cargo-llvm-cov
        run: command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --locked

      - name: Coverage gate
        # main.rs is process wiring with no logic; it is the only exclusion.
        run: >
          cargo llvm-cov --all-features --workspace --locked
          --ignore-filename-regex 'src[\\/]main\.rs'
          --fail-under-lines 95
          --lcov --output-path lcov.info

      - name: Summary
        if: always()
        run: |
          cargo llvm-cov report --ignore-filename-regex 'src[\\/]main\.rs' --summary-only >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
